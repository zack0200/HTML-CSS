<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
          width: 500px;
          border-collapse: collapse;
        }
        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 8px;
        }
        th, td{
            border: 1px solid black;
            padding: 8px;
        }
        .cnome, .cprof{
            background-color: aqua;
        }
        .cgrup{
            background-color: palegreen;
        }
    </style>
</head>
<body>
    <h1>Execício de Tabela</h1>
    <!-- colgrup é otimo para colocar class de cada coluna da tabela,o  col representa cada coluna,o span para colocar mais de uma coluna com uma unica class-->
    <table>
        <colgroup>
        <col class="cnome">
        <col class="cgrup" span="2">
        <col class="cprof">
        </colgroup>
        <caption>Cadastros</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>20</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>M</td>
            <td>30</td>
            <td>Empresario</td>
        </tr>
        <tr>
            <td>Mario</td>
            <td>M</td>
            <td>28</td>
            <td>Pescador</td>
        </tr>

    </table>
</body>
</html>
