<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 500px;
            border: 1px solid blanchedalmond;
        }
    </style>
</head>
<body>
    <!--tamanho padrão 300x150-->
    <h1>Testando o uso de iframe</h1>
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scrolling="auto">
            <!--parametros frameborder borda do iframe, scrolling tela de rolagem-->
            <a href="https://gustavoguanabara.github.io" target="_blank"></a>
        </iframe>
        
        para aprender a progamar.</p>

        <p>o site do é legal,pena que não funciona dentro de iframe!
            <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
                <a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
            </iframe>
        </p>
</body>
</html>
