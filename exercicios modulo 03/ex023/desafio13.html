<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 13 uma Tabela</title>
    <style>
        body{
           font-family: Arial, Helvetica, sans-serif; 
        }
        table{
            width: 300px;
        }
        td{
            border:1px solid black ;
            padding: 10px;
            text-align: center;
        }

    </style>
</head>
<body>
    <table>
        <tr>
<td>1</td>
<td>2</td>
<td>3</td>
        </tr>
        <tr>
<td>4</td>
<td>5</td>
<td>6</td>
        </tr>
        <tr>
<td>7</td>
<td colspan="2">8</td>
<td>9</td>
        </tr>
        <tr>
<td>10</td>
<td>11</td>
<td>12</td>

        </tr>
        <tr>

        </tr>
    </table>
</body>
</html>
