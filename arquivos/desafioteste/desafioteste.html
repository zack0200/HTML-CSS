<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Desafio Teste Tabela</title>
    <style>
        body{

        table{
            border-collapse: collapse;   
            width: 500px;
        }
        caption{

            font-weight: bold;
            padding: 10px;

        }
        th, td, caption{

        }
        .g{
 background-color: lightgray;

        .m{

        /* falta algumas coisas,preciso melhorar*/

</head>
